name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the container image to GHCR
  id-token: write # cosign keyless signing (Sigstore OIDC)

jobs:
  # Cross-platform binaries, archives, checksums, SBOMs, a cosign-signed
  # checksum file, and the GitHub Release with generated notes — all via
  # GoReleaser (.goreleaser.yaml).
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can be generated
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: sigstore/cosign-installer@v3 # provides `cosign` for signing
      - uses: anchore/sbom-action/download-syft@v0 # provides `syft` for SBOMs
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Multi-arch container image (tasksd) to GHCR — unchanged from before.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
